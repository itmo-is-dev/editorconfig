name: "publish packages"

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/publish.yml'
      - './Itmo.Dev.Editorconfig/Itmo.Dev.Editorconfig.props'
      - './Itmo.Dev.Editorconfig/Itmo.Dev.Editorconfig.csproj'
      - './Itmo.Dev.Editorconfig/.editorconfig'

  workflow_dispatch:

jobs:
  build-and-publish:
    name: build & publish
    runs-on: ubuntu-latest
    environment: nuget.org
    
    permissions:
      id-token: write
    
    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.x

      - name: restore
        run: dotnet restore Itmo.Dev.Editorconfig.slnx

      - name: build
        run: dotnet build Itmo.Dev.Editorconfig.slnx -c Release --no-restore /p:PatchVersion=${{ github.run_number }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: publish to GitHub nuget repository
        run: |
          for file in artifacts/package/release/*.nupkg
          do
            dotnet nuget push "${file#/}" --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}
          done